name: Scan bot de trading

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-trading-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cycle de scan
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          WATCHLIST: "crypto:BTC/USDT:5m,crypto:ETH/USDT:5m,crypto:SOL/USDT:15m,forex:EUR/USD:5m,forex:GBP/USD:15m,forex:XAU/USD:15m,otc:BTC/USD OTC:15m,otc:EUR/USD OTC:15m"
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: "1"
        run: python gh_scan.py

      - name: Sauvegarder l'historique des signaux
        run: |
          git config user.name "trading-bot-actions"
          git config user.email "actions@github.com"
          if [ -d data_store ] && [ -n "$(ls -A data_store 2>/dev/null)" ]; then
            git add -f data_store
            if git diff --cached --quiet; then
              echo "Historique inchangé, rien à sauvegarder."
            else
              git commit -m "Historique des signaux (scan automatique) [skip ci]"
              git push
            fi
          else
            echo "Aucun historique à sauvegarder ce cycle."
          fi
