name: Bot par sessions

on:
  schedule:
    - cron: "3 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-24-7
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer le bot pour une session limitée
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          AUTO_SCAN: "1"
          WATCHLIST: "crypto:BTC/USDT:5m,crypto:ETH/USDT:5m,crypto:SOL/USDT:15m,forex:EUR/USD:5m,forex:GBP/USD:15m,forex:XAU/USD:15m,otc:BTC/USD OTC:15m,otc:EUR/USD OTC:15m"
          MPLBACKEND: "Agg"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          timeout -k 30s 335m python -u bot.py
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "Session terminée normalement après la durée prévue."
            exit 0
          fi
          exit "$status"

      - name: Sauvegarder l'historique
        run: |
          git config user.name "trading-bot-actions"
          git config user.email "actions@github.com"
          if [ -d data_store ] && [ -n "$(ls -A data_store 2>/dev/null)" ]; then
            git add -f data_store
            if git diff --cached --quiet; then
              echo "Historique inchangé, rien à sauvegarder."
            else
              git commit -m "Historique du bot (fin de session) [skip ci]"
              git push
            fi
          else
            echo "Aucune donnée à sauvegarder."
          fi